name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: .next
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true

  visual-qa:
    name: Visual QA (Playwright probe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    env:
      NEXT_TELEMETRY_DISABLED: 1
      EVIDENCE_DIR: ${RUNNER_TEMP}/visual-qa
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start production server
        run: |
          set -euo pipefail
          pnpm start &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          for i in {1..30}; do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 30s" >&2
          kill "$SERVER_PID" || true
          exit 1
      - name: Run visual-qa probe
        run: pnpm exec node tests/qa/visual-qa.mjs
      - name: Stop production server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-qa-evidence
          path: ${RUNNER_TEMP}/visual-qa
          retention-days: 7
          if-no-files-found: warn

  rooms-race:
    name: Rooms-race QA (Playwright probe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start production server (hermetic :3101)
        run: |
          set -euo pipefail
          DB_FILE="${RUNNER_TEMP}/rooms-race-qa.db"
          DATABASE_URL="file:${DB_FILE}" PORT=3101 pnpm start &
